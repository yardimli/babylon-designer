<!doctype html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>BabylonJS 3D Designer</title>
	<link rel="stylesheet" href="./src/style.css">
</head>
<body class="flex flex-col h-screen w-screen bg-base-300 text-base-content font-sans overflow-hidden">

<!-- Top Menubar -->
<nav class="h-12 bg-base-100 border-b border-base-content/10 flex items-center px-4 gap-2 flex-none z-10">
	<div class="font-bold text-lg mr-4 text-primary">BabylonDesigner</div>

	<!-- Gizmo Controls -->
	<div class="join mr-4">
		<button id="btn-gizmo-pos" class="btn btn-sm join-item btn-active" title="Position Gizmo">Pos</button>
		<button id="btn-gizmo-rot" class="btn btn-sm join-item" title="Rotation Gizmo">Rot</button>
		<button id="btn-gizmo-scl" class="btn btn-sm join-item" title="Scale Gizmo">Scl</button>
	</div>

	<!-- Camera Views -->
	<!-- Added Camera Position Buttons -->
	<div class="join mr-4">
		<button id="btn-view-top" class="btn btn-sm join-item" title="Top View">T</button>
		<button id="btn-view-bottom" class="btn btn-sm join-item" title="Bottom View">B</button>
		<button id="btn-view-front" class="btn btn-sm join-item" title="Front View">F</button>
		<button id="btn-view-back" class="btn btn-sm join-item" title="Back View">Bk</button>
		<button id="btn-view-left" class="btn btn-sm join-item" title="Left View">L</button>
		<button id="btn-view-right" class="btn btn-sm join-item" title="Right View">R</button>
	</div>

	<!-- History Controls -->
	<div class="join mr-4">
		<button id="btn-undo" class="btn btn-sm join-item" title="Undo">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
		</button>
		<button id="btn-redo" class="btn btn-sm join-item" title="Redo">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
		</button>
	</div>

	<div class="join mr-auto">
		<button id="btn-menu-new" class="btn btn-sm join-item">New</button>
		<button id="btn-menu-save" class="btn btn-sm join-item">Save</button>
		<button id="btn-menu-save-as" class="btn btn-sm join-item">Save As</button>
		<button id="btn-menu-load" class="btn btn-sm join-item">Load</button>
		<!-- Added Align Button -->
		<button id="btn-menu-align" class="btn btn-sm join-item btn-disabled" disabled>Align</button>
		<!-- Added Scene Settings Button -->
		<button id="btn-menu-scene" class="btn btn-sm join-item">Scene</button>
	</div>

	<a href="/index-shapes.html" target="_blank" class="btn btn-sm btn-outline btn-secondary">
		Open Shape Editor ↗
	</a>
	<a href="/index-assembly.html" target="_blank" class="btn btn-sm btn-outline btn-secondary">
		Open Assembly ↗
	</a>
	<a href="/index-materials.html" target="_blank" class="btn btn-sm btn-outline btn-secondary">
		Open Material Editor ↗
	</a>
</nav>

<!-- Main Workspace -->
<div class="flex-1 flex overflow-hidden">
	<!-- Left Sidebar: Assets -->
	<div class="w-64 flex-none bg-base-200 p-4 border-r border-base-content/10 flex flex-col gap-4 overflow-y-auto">
		<h2 class="text-xl font-bold mb-2">Primitives</h2>
		<div id="primitives-list" class="grid grid-cols-2 gap-2">
			<!-- Draggables generated by JS -->
		</div>

		<h2 class="text-xl font-bold mt-4 mb-2">Shapes</h2>
		<div id="shapes-list" class="grid grid-cols-2 gap-2">
			<!-- Draggables generated by JS -->
		</div>

		<h2 class="text-xl font-bold mt-4 mb-2">Lights</h2>
		<div id="lights-list" class="grid grid-cols-2 gap-2">
			<!-- Draggables generated by JS -->
		</div>

		<div class="mt-auto pt-4 border-t border-base-content/10">
			<button id="btn-import-mat" class="btn btn-secondary btn-outline w-full">
				Import Material
			</button>
		</div>
	</div>

	<!-- Center: Part -->
	<div class="flex-1 relative bg-black">
		<canvas id="renderCanvas" class="w-full h-full touch-none"></canvas>
	</div>

	<!-- Right Sidebar: Properties -->
	<div class="w-80 flex-none bg-base-200 flex flex-col border-l border-base-content/10 overflow-hidden">
		<!-- Hierarchy / Tree View -->
		<div class="flex-none h-1/3 flex flex-col border-b border-base-content/10">
			<h2 class="text-sm font-bold p-2 bg-base-300">Part Hierarchy</h2>
			<div id="part-explorer" class="flex-1 overflow-y-auto p-2 text-sm select-none">
				<!-- Tree populated by JS -->
			</div>
		</div>

		<!-- Properties Editor -->
		<div class="flex-1 overflow-y-auto p-4">
			<h2 id="properties-header" class="text-xl font-bold mb-4">Properties</h2>
			<div id="property-editor" class="flex flex-col gap-3 opacity-50 pointer-events-none">

				<!-- ID -->
				<label class="form-control w-full">
					<div class="label"><span class="label-text">ID</span></div>
					<input type="text" id="prop-id" class="input input-bordered w-full input-sm" />
				</label>

				<!-- Visibility Toggle -->
				<div class="form-control">
					<label class="label cursor-pointer justify-start gap-2">
						<span class="label-text w-16">Visible</span>
						<input type="checkbox" id="prop-visible" class="checkbox checkbox-xs" />
					</label>
				</div>

				<!-- Parent -->
				<label class="form-control w-full">
					<div class="label"><span class="label-text">Parent</span></div>
					<select id="prop-parent" class="select select-bordered w-full select-sm"></select>
				</label>

				<!-- Material -->
				<label class="form-control w-full">
					<div class="label"><span class="label-text">Material</span></div>
					<select id="prop-material" class="select select-bordered w-full select-sm"></select>
				</label>

				<!-- Texture Scale -->
				<label class="form-control w-full hidden" id="container-texture-scale">
					<div class="label"><span class="label-text">Texture Scale (U, V)</span></div>
					<div class="grid grid-cols-2 gap-1">
						<input type="number" id="prop-mat-uscale" class="input input-bordered w-full input-sm px-1" step="0.1" placeholder="U" />
						<input type="number" id="prop-mat-vscale" class="input input-bordered w-full input-sm px-1" step="0.1" placeholder="V" />
					</div>
				</label>

				<div class="divider my-1"></div>

				<!-- Transforms Helper -->
				<div id="transform-container"></div>

				<!-- Light Properties -->
				<div id="light-properties" class="hidden">
					<div class="divider my-1"></div>
					<h3 class="text-xs font-bold opacity-70 mb-2">Light</h3>
					<label class="form-control w-full">
						<div class="label"><span class="label-text">Intensity</span></div>
						<input type="number" id="prop-light-intensity" class="input input-bordered w-full input-sm" step="0.1" min="0" />
					</label>
					<label class="form-control w-full mt-2">
						<div class="label"><span class="label-text">Diffuse Color</span></div>
						<input type="color" id="prop-light-diffuse" class="h-8 w-full" />
					</label>

					<label class="form-control w-full mt-2 hidden" id="container-light-direction">
						<div class="label"><span class="label-text">Direction (Deg X, Y, Z)</span></div>
						<div class="grid grid-cols-3 gap-1">
							<input type="number" id="prop-light-dir-x" class="input input-bordered w-full input-sm px-1" step="0.1" min="0" max="360" placeholder="X" />
							<input type="number" id="prop-light-dir-y" class="input input-bordered w-full input-sm px-1" step="0.1" min="0" max="360" placeholder="Y" />
							<input type="number" id="prop-light-dir-z" class="input input-bordered w-full input-sm px-1" step="0.1" min="0" max="360" placeholder="Z" />
						</div>
					</label>
					<label class="form-control w-full mt-2 hidden" id="container-light-angle">
						<div class="label"><span class="label-text">Angle (Deg)</span></div>
						<input type="number" id="prop-light-angle" class="input input-bordered w-full input-sm" step="1" min="0" max="180" />
					</label>
					<label class="form-control w-full mt-2 hidden" id="container-light-exponent">
						<div class="label"><span class="label-text">Exponent</span></div>
						<input type="number" id="prop-light-exponent" class="input input-bordered w-full input-sm" step="0.1" min="0" />
					</label>
				</div>

				<div class="divider my-1"></div>

				<!-- Shadows -->
				<div class="form-control">
					<label class="label cursor-pointer justify-start gap-2">
						<input type="checkbox" id="prop-receive-shadows" class="checkbox checkbox-xs" />
						<span class="label-text">Receive Shadows</span>
					</label>
				</div>
				<div class="form-control">
					<label class="label cursor-pointer justify-start gap-2">
						<input type="checkbox" id="prop-cast-shadows" class="checkbox checkbox-xs" />
						<span class="label-text">Cast Shadows</span>
					</label>
				</div>

				<!-- NEW: Negative (Subtract) -->
				<div class="form-control">
					<label class="label cursor-pointer justify-start gap-2">
						<input type="checkbox" id="prop-negative" class="checkbox checkbox-xs" />
						<span class="label-text text-error font-bold">Negative (Subtract)</span>
					</label>
				</div>

				<div class="divider my-1"></div>

				<!-- Duplicate Button -->
				<button id="btn-duplicate-asset" class="btn btn-secondary btn-sm btn-outline w-full">Duplicate</button>

				<!-- Delete Button -->
				<button id="btn-delete-asset" class="btn btn-error btn-sm btn-outline w-full">Delete Asset</button>

			</div>
		</div>
	</div>
</div>

<!-- Bottom Status Bar -->
<footer class="h-6 bg-base-100 border-t border-base-content/10 flex items-center px-4 text-xs select-none flex-none">
	<span class="opacity-70 mr-2">Status:</span>
	<span id="status-text" class="font-mono font-bold">Untitled</span>
</footer>

<!-- Import Material Modal -->
<dialog id="import_mat_modal" class="modal">
	<div class="modal-box">
		<h3 class="font-bold text-lg mb-4">Import Material from Library</h3>
		<div id="import-mat-list" class="flex flex-col gap-1 max-h-64 overflow-y-auto border border-base-content/20 rounded p-2">
			<!-- Populated by JS -->
		</div>
		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Cancel</button>
			</form>
		</div>
	</div>
</dialog>

<!-- Save/Load Part Modal -->
<dialog id="save_load_modal" class="modal">
	<div class="modal-box">
		<h3 id="modal-title" class="font-bold text-lg mb-4">Manage Parts</h3>

		<!-- File List -->
		<div class="border border-base-content/20 rounded p-2 h-48 overflow-y-auto flex flex-col gap-1 mb-4" id="part-list">
			<!-- Populated by JS -->
		</div>

		<!-- Save Input -->
		<label class="input input-bordered flex items-center gap-2 mb-4">
			Filename
			<input type="text" id="save-part-name" class="grow" placeholder="my_part" />
			<span class="badge badge-info">.json</span>
		</label>

		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Cancel</button>
			</form>
			<button id="btn-modal-save" class="btn btn-success">Save</button>
		</div>
	</div>
</dialog>

<!-- Added Alignment Modal -->
<dialog id="align_modal" class="modal">
	<div class="modal-box">
		<h3 class="font-bold text-lg mb-4">Alignment Tools</h3>

		<!-- Row 1: Axis Scope -->
		<div class="flex gap-4 mb-4 p-2 bg-base-200 rounded">
			<span class="font-bold text-sm opacity-70 my-auto">Axes:</span>
			<label class="cursor-pointer label">
				<span class="label-text mr-2">X</span>
				<input type="checkbox" id="align-axis-x" class="checkbox checkbox-sm checkbox-error" checked />
			</label>
			<label class="cursor-pointer label">
				<span class="label-text mr-2">Y</span>
				<input type="checkbox" id="align-axis-y" class="checkbox checkbox-sm checkbox-success" />
			</label>
			<label class="cursor-pointer label">
				<span class="label-text mr-2">Z</span>
				<input type="checkbox" id="align-axis-z" class="checkbox checkbox-sm checkbox-info" />
			</label>
		</div>

		<!-- Row 2: Alignment -->
		<div class="mb-2">
			<div class="text-xs font-bold opacity-50 mb-1">ALIGNMENT</div>
			<div class="join w-full grid grid-cols-4">
				<button id="btn-align-min" class="btn btn-sm join-item btn-outline">Min</button>
				<button id="btn-align-center" class="btn btn-sm join-item btn-outline">Center</button>
				<button id="btn-align-max" class="btn btn-sm join-item btn-outline">Max</button>
				<button id="btn-align-pivot" class="btn btn-sm join-item btn-outline">Pivot</button>
			</div>
		</div>

		<!-- Row 3: Distribution -->
		<div class="mb-2">
			<div class="text-xs font-bold opacity-50 mb-1">DISTRIBUTION</div>
			<div class="join w-full grid grid-cols-2">
				<button id="btn-dist-center" class="btn btn-sm join-item btn-outline">Distribute Centers</button>
				<button id="btn-dist-gap" class="btn btn-sm join-item btn-outline">Distribute Gaps</button>
			</div>
		</div>

		<!-- Row 4: Spacing -->
		<div class="mb-4">
			<div class="text-xs font-bold opacity-50 mb-1">SPACING</div>
			<div class="join w-full">
				<input type="number" id="align-spacing-val" class="input input-sm input-bordered join-item w-full" value="0" placeholder="Units" />
				<button id="btn-apply-spacing" class="btn btn-sm join-item btn-primary">Apply Spacing</button>
			</div>
		</div>

		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Close</button>
			</form>
		</div>
	</div>
</dialog>

<!-- Added Scene Settings Modal -->
<dialog id="scene_settings_modal" class="modal">
	<div class="modal-box">
		<h3 class="font-bold text-lg mb-4">Scene Settings</h3>

		<label class="form-control w-full max-w-xs mb-4">
			<div class="label">
				<span class="label-text">Background Color</span>
			</div>
			<input type="color" id="scene-bg-color" class="input input-bordered w-full h-10 p-1" />
		</label>

		<label class="form-control w-full max-w-xs mb-4">
			<div class="label">
				<span class="label-text">Ambient Light Intensity</span>
				<span class="label-text-alt" id="val-ambient-intensity">1.0</span>
			</div>
			<input type="range" min="0" max="2" step="0.1" value="1" id="scene-ambient-intensity" class="range range-xs" />
		</label>

		<!-- Added Light Colors -->
		<label class="form-control w-full max-w-xs mb-4">
			<div class="label">
				<span class="label-text">Light Diffuse Color</span>
			</div>
			<input type="color" id="scene-light-diffuse" class="input input-bordered w-full h-10 p-1" />
		</label>

		<label class="form-control w-full max-w-xs mb-4">
			<div class="label">
				<span class="label-text">Light Ground Color</span>
			</div>
			<input type="color" id="scene-light-ground" class="input input-bordered w-full h-10 p-1" />
		</label>

		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Close</button>
			</form>
		</div>
	</div>
</dialog>

<!-- Global Mouse Wheel handler for number inputs -->
<script>
	document.addEventListener('wheel', function(e) {
		if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
			if (document.activeElement === e.target) {
				e.preventDefault();
				const step = 0.01;
				const direction = e.deltaY < 0 ? 1 : -1;
				const currentValue = parseFloat(e.target.value) || 0;
				e.target.value = parseFloat((currentValue + direction * step).toFixed(2));
				e.target.dispatchEvent(new Event('input', { bubbles: true }));
				e.target.dispatchEvent(new Event('change', { bubbles: true }));
			}
		}
	}, { passive: false });
</script>

<script type="module" src="/src/main-part.js"></script>
</body>
</html>
