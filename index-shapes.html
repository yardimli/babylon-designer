<!doctype html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>BabylonJS Shape Editor</title>
	<link rel="stylesheet" href="./src/style.css">
</head>
<body class="flex flex-col h-screen w-screen bg-base-300 text-base-content font-sans overflow-hidden">

<!-- Top Bar -->
<nav class="h-12 bg-base-100 border-b border-base-content/10 flex items-center px-4 gap-2 flex-none z-10 justify-between">
	<div class="font-bold text-lg text-accent">Shape Editor</div>
	<div class="flex gap-2">
		<a href="/index.html" target="_blank" class="btn btn-sm btn-outline btn-secondary">
			Part Designer ↗
		</a>
	</div>
</nav>

<div class="flex flex-1 overflow-hidden">
	<!-- Left: File List & Tools -->
	<div class="w-64 bg-base-200 border-r border-base-content/10 flex flex-col">

		<!-- File Management -->
		<div class="flex-none p-4 border-b border-base-content/10">
			<h2 class="font-bold mb-2 text-xs uppercase opacity-70">Saved Shapes</h2>
			<div id="file-list" class="h-32 overflow-y-auto bg-base-100/50 rounded p-2 mb-2 text-sm">
				<span class="loading loading-spinner loading-xs"></span>
			</div>
			<div class="join w-full">
				<input type="text" id="inp-filename" class="input input-xs input-bordered join-item w-full" placeholder="Shape Name" />
				<button id="btn-save" class="btn btn-xs btn-primary join-item">Save</button>
				<button id="btn-new" class="btn btn-xs btn-ghost join-item">New</button>
			</div>
		</div>

		<!-- Tools -->
		<div class="flex-1 p-4 flex flex-col gap-2">
			<h2 class="font-bold text-xs uppercase opacity-70">Tools</h2>
			<button id="btn-tool-select" class="btn btn-sm btn-active">Select / Edit</button>
			<div class="divider my-1">Add</div>
			<button id="btn-tool-rect" class="btn btn-sm btn-outline">Rectangle</button>
			<button id="btn-tool-circle" class="btn btn-sm btn-outline">Circle</button>
			<button id="btn-tool-poly" class="btn btn-sm btn-outline">Draw Polygon</button>

			<div class="divider my-1">Global</div>
			<label class="form-control w-full">
				<div class="label"><span class="label-text text-xs">Extrusion Height</span></div>
				<input type="number" id="inp-extrusion" class="input input-sm input-bordered" value="1" step="0.1" />
			</label>
		</div>
	</div>

	<!-- Center: 2D Canvas -->
	<div class="flex-1 bg-base-100 relative overflow-hidden flex flex-col">
		<div class="absolute top-2 left-2 text-xs opacity-50 pointer-events-none">2D Drawing (Top View)</div>
		<canvas id="drawCanvas" class="w-full h-full cursor-crosshair"></canvas>
	</div>

	<!-- Right: 3D Preview & Properties -->
	<div class="w-80 bg-base-200 border-l border-base-content/10 flex flex-col">

		<!-- 3D Preview -->
		<div class="h-1/2 bg-black relative border-b border-base-content/10">
			<div class="absolute top-2 left-2 text-xs text-white opacity-50 pointer-events-none z-10">3D Preview</div>
			<canvas id="previewCanvas" class="w-full h-full outline-none"></canvas>
		</div>

		<!-- Properties -->
		<div class="flex-1 p-4 overflow-y-auto">
			<h2 class="font-bold mb-4">Properties</h2>
			<div id="properties-container" class="flex flex-col gap-3 opacity-50 pointer-events-none">
				<div class="text-xs italic">Select a shape or line to edit</div>
			</div>

			<div class="mt-4 pt-4 border-t border-base-content/10">
				<button id="btn-delete-shape" class="btn btn-error btn-sm btn-outline w-full hidden">Delete Shape</button>
			</div>
		</div>
	</div>
</div>

<!-- NEW: Global Mouse Wheel handler for number inputs -->
<script>
	document.addEventListener('wheel', function(e) {
		if (e.target.tagName === 'INPUT' && e.target.type === 'number') {
			if (document.activeElement === e.target) {
				e.preventDefault();
				const step = parseFloat(e.target.step) || 0.1;
				const direction = e.deltaY < 0 ? 1 : -1;
				const currentValue = parseFloat(e.target.value) || 0;
				e.target.value = parseFloat((currentValue + direction * step).toFixed(2));
				e.target.dispatchEvent(new Event('input', { bubbles: true }));
				e.target.dispatchEvent(new Event('change', { bubbles: true }));
			}
		}
	}, { passive: false });
</script>

<script type="module" src="/src/shapeEditor.js"></script>
</body>
</html>
